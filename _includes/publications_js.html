<script>
  (function () {
    var activeFilter = "all";
    var filterContainer = document.getElementById("pub-filters");
    var searchInput = document.getElementById("bibsearch");
    var showAllYearsButton = document.getElementById("pub-show-all-years");
    var entries = Array.prototype.slice.call(
      document.querySelectorAll(".bib-entry")
    );
    var years = entries
      .map(function (entry) {
        return parseInt(entry.getAttribute("data-year") || "", 10);
      })
      .filter(function (year) {
        return !isNaN(year);
      });
    var maxYear = years.length ? Math.max.apply(null, years) : null;
    var recentYearCutoff = maxYear !== null ? maxYear - 4 : null;
    var showAllYears = false;

    function assignEntryNumbers() {
      var totalEntries = entries.length;
      entries.forEach(function (entry, index) {
        var numberSlot = entry.querySelector(".pub-number");
        if (!numberSlot) return;
        numberSlot.textContent = totalEntries - index + ".";
      });
    }

    function getSearchTerm() {
      return searchInput ? searchInput.value.trim().toLowerCase() : "";
    }

    function tokenMatch(haystack, needle) {
      if (!haystack) return false;
      var parts = haystack.split(",");
      for (var i = 0; i < parts.length; i++) {
        if (parts[i].trim() === needle) return true;
      }
      return false;
    }

    function entryMatchesFilter(entry, filter) {
      var isSelected = entry.getAttribute("data-selected") === "true";
      var topics = (entry.getAttribute("data-topics") || "").toLowerCase();
      var system = (entry.getAttribute("data-system") || "").toLowerCase();
      var application = (entry.getAttribute("data-application") || "").toLowerCase();

      if (filter === "all") {
        return true;
      }
      if (filter === "selected") {
        return isSelected;
      }
      if (filter === "applied") {
        return !tokenMatch(topics, "methods") && !tokenMatch(topics, "review");
      }
      if (filter.indexOf(":") !== -1) {
        var idx = filter.indexOf(":");
        var namespace = filter.slice(0, idx);
        var value = filter.slice(idx + 1).toLowerCase();
        if (namespace === "system") return tokenMatch(system, value);
        if (namespace === "application") return tokenMatch(application, value);
        if (namespace === "topic") return tokenMatch(topics, value) || topics.indexOf(value) !== -1;
        return false;
      }

      return topics.indexOf((filter || "").toLowerCase()) !== -1;
    }

    function entryMatchesSearch(entry, searchTerm) {
      if (!searchTerm) return true;
      return (entry.textContent || "").toLowerCase().indexOf(searchTerm) !== -1;
    }

    function entryMatchesYearWindow(entry) {
      if (showAllYears || recentYearCutoff === null) return true;
      var year = parseInt(entry.getAttribute("data-year") || "", 10);
      if (isNaN(year)) return true;
      return year >= recentYearCutoff;
    }

    function updateYearVisibility() {
      var yearHeaders = Array.prototype.slice.call(
        document.querySelectorAll(".publications h2.year")
      );

      yearHeaders.forEach(function (header) {
        var year = (header.textContent || "").trim();
        var list = header.nextElementSibling;
        var yearEntries = Array.prototype.slice.call(
          document.querySelectorAll('.bib-entry[data-year="' + year + '"]')
        );
        var hasVisibleEntries = yearEntries.some(function (entry) {
          return entry.style.display !== "none";
        });

        header.style.display = hasVisibleEntries ? "" : "none";
        if (list && list.classList && list.classList.contains("bibliography")) {
          list.style.display = hasVisibleEntries ? "" : "none";
        }
      });
    }

    function applyFilters() {
      var searchTerm = getSearchTerm();

      entries.forEach(function (entry) {
        var show =
          entryMatchesYearWindow(entry) &&
          entryMatchesFilter(entry, activeFilter) &&
          entryMatchesSearch(entry, searchTerm);
        entry.style.display = show ? "" : "none";
      });

      updateYearVisibility();
    }

    function updateArchiveToggle() {
      if (!showAllYearsButton) return;
      var hasOlderYears = years.some(function (year) {
        return year < recentYearCutoff;
      });
      if (!hasOlderYears) {
        showAllYearsButton.style.display = "none";
        return;
      }
      showAllYearsButton.style.display = showAllYears ? "none" : "";
    }

    function parseBadgeCount(text) {
      var normalized = (text || "").replace(/,/g, "").trim().toUpperCase();
      var match = normalized.match(/(\d+(?:\.\d+)?)([KMB])?/);
      if (!match) return null;

      var value = parseFloat(match[1]);
      var suffix = match[2] || "";
      if (suffix === "K") value *= 1000;
      if (suffix === "M") value *= 1000000;
      if (suffix === "B") value *= 1000000000;
      return value;
    }

    function updateCitationThresholds() {
      var badgeSlots = Array.prototype.slice.call(
        document.querySelectorAll(".dimensions-badge-slot")
      );

      badgeSlots.forEach(function (slot) {
        var min = parseFloat(slot.getAttribute("data-min-citations") || "20");
        var count = parseBadgeCount(slot.textContent);
        if (count !== null) {
          slot.style.display = count >= min ? "" : "none";
        }

        var badgeGroup = slot.closest(".badges");
        if (badgeGroup) {
          var hasVisibleChildren = Array.prototype.some.call(
            badgeGroup.children,
            function (child) {
              return child.style.display !== "none";
            }
          );
          badgeGroup.style.display = hasVisibleChildren ? "" : "none";
        }
      });
    }

    if (filterContainer) {
      var buttons = Array.prototype.slice.call(
        filterContainer.querySelectorAll("[data-filter]")
      );

      filterContainer.addEventListener("click", function (e) {
        var btn = e.target.closest("[data-filter]");
        if (!btn) return;
        e.preventDefault();
        activeFilter = btn.getAttribute("data-filter");
        buttons.forEach(function (button) {
          button.classList.toggle("active", button === btn);
        });
        applyFilters();
      });
    }

    if (searchInput) {
      searchInput.addEventListener("input", applyFilters);
    }

    if (showAllYearsButton) {
      showAllYearsButton.addEventListener("click", function () {
        showAllYears = true;
        updateArchiveToggle();
        applyFilters();
      });
    }

    if (entries.length > 0) {
      assignEntryNumbers();
      updateArchiveToggle();
      applyFilters();
    }

    updateCitationThresholds();
    window.addEventListener("load", updateCitationThresholds);
    setTimeout(updateCitationThresholds, 1200);
    setTimeout(updateCitationThresholds, 3000);

    if (window.MutationObserver) {
      var observer = new MutationObserver(updateCitationThresholds);
      document.querySelectorAll(".dimensions-badge-slot").forEach(function (slot) {
        observer.observe(slot, {
          childList: true,
          subtree: true,
          characterData: true
        });
      });
    }

    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      }
      return new Promise(function (resolve, reject) {
        var textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.top = "-1000px";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          var ok = document.execCommand("copy");
          document.body.removeChild(textarea);
          ok ? resolve() : reject(new Error("execCommand failed"));
        } catch (err) {
          document.body.removeChild(textarea);
          reject(err);
        }
      });
    }

    document.addEventListener("click", function (e) {
      var btn = e.target.closest(".copy-bib-btn");
      if (!btn) return;
      e.preventDefault();

      var entry = btn.closest(".bib-entry");
      if (!entry) return;

      var bibBlock = entry.querySelector(".bibtex.hidden");
      if (!bibBlock) return;

      var text = (bibBlock.textContent || "").trim();
      if (!text) return;

      var original = btn.textContent;
      copyTextToClipboard(text)
        .then(function () {
          btn.textContent = "Copied!";
          setTimeout(function () {
            btn.textContent = original;
          }, 1500);
        })
        .catch(function () {
          btn.textContent = "Copy failed";
          setTimeout(function () {
            btn.textContent = original;
          }, 1500);
        });
    });
  })();
</script>
