{% if site.bib_search %}
  <div class="bibsearch-container">
    <label class="sr-only" for="bibsearch">Search publications</label>
    <input
      type="text"
      id="bibsearch"
      spellcheck="false"
      autocomplete="off"
      class="search bibsearch-form-input"
      placeholder="Search publications by title, author, journal, or keyword"
    >
  </div>
{% endif %}
