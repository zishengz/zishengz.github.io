name: Axe accessibility testing

on:
  workflow_dispatch:
    inputs:
      path:
        description: "Optional site path to check, for example publications/"
        required: false
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.0.2"
          bundler-cache: true

      - name: Install build and browser dependencies
        run: |
          npm install -g mermaid.cli
          npm install -g http-server @axe-core/cli chromedriver

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build

      - name: Serve built site
        run: |
          http-server _site -p 8080 > /tmp/http-server.log 2>&1 &
          echo $! > /tmp/http-server.pid

      - name: Run axe
        run: |
          TARGET_PATH="${{ github.event.inputs.path }}"
          if [ -n "$TARGET_PATH" ] && [ "${TARGET_PATH#/}" = "$TARGET_PATH" ]; then
            TARGET_PATH="/$TARGET_PATH"
          fi
          axe --chromedriver-path "$(npm root -g)/chromedriver/bin/chromedriver" "http://127.0.0.1:8080${TARGET_PATH}" --load-delay=1500 --exit

      - name: Stop local server
        if: always()
        run: kill "$(cat /tmp/http-server.pid)"
